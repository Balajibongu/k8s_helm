apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  # namespace: roboshop
  labels:
    purpose: dp-demo
    project: roboshop
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      purpose: headless-svc-demo
      project: roboshop
  # pod definition
  template:
    metadata:
      labels:
        # purpose: dp-demo
        purpose: headless-svc-demo
        project: roboshop
    spec:
      containers:
      - name: nginx
        image: {{.Values.deployment.imageVersion}}:{{.Values.deployment.version}}